services:
  backend:
    build: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el fichero .env (copia .env.example)}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-24}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/convive.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - convive-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  convive-data:
